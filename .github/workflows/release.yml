name: Release

# Pushing a version tag (e.g. v1.1.0) builds the Windows installer and publishes it as a GitHub release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { printing = index($0, "[" v "]") > 0; next }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          echo "Release notes for $version:"; cat release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: WebP Utility ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*.exe
